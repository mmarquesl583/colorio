services:
  - type: web
    name: color-io-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Set this in the Render dashboard to enable GET /reports?key=... for
      # viewing "reportar pergunta" submissions from Frase da IA. Leave unset
      # to keep the endpoint disabled (404).
      - key: REPORTS_KEY
        sync: false
