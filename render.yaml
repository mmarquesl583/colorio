services:
  - type: web
    name: color-io-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Set this in the Render dashboard to enable GET /reports?key=... for
      # viewing "reportar pergunta" submissions from Frase da IA. Leave unset
      # to keep the endpoint disabled (404).
      - key: REPORTS_KEY
        sync: false
      # Player stats/history/achievements persistence (Supabase Postgres).
      # Set both in the Render dashboard — SUPABASE_SERVICE_ROLE_KEY is the
      # secret "service_role" key from Supabase Project Settings > API
      # Keys (NOT the publishable/anon key the client uses). Leave unset to
      # keep the server running with stats writes silently skipped.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
